site_name: Aplicaciones Ofimáticas
site_url: https://lupastance.github.io/ofiapps

nav:
  - 📚 Inicio: index.md
  - 1️⃣ Introducción a las aplicaciones ofimáticas: 1.md
  - 2️⃣ Instalación y configuración de aplicaciones: 2.md
  - 3️⃣ Procesadores de texto: 3.md
  - 4️⃣ Hojas de cálculo: 4.md
  - 5️⃣Bases de datos ofimáticas: 5.md
  - 6️⃣ Tratamiento de imágenes digitales: 6.md
  - 7️⃣ Tratamiento de vídeo digital: 7.md
  - 8️⃣ Presentaciones multimedia: 8.md
  - 9️⃣ Correo electrónico y agenda electrónica: 9.md
  - 1️⃣0️⃣ Soporte al usuario y resolución de incidencias: 10.md


theme:
  language: es
  logo: assets/logo.png
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: pink
      toggle:
        icon: material/brightness-4
        name: 💤 Cambiar a modo oscuro
    
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 👹 Activar el modo psicópata

  icon:
    repo: fontawesome/brands/github
    annotation: material/star-four-points-circle

  features:
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - header.autohide
    - content.code.copy
    - toc.integrate
    - content.tooltips

plugins:
  - search:
      lang: es

repo_url: https://github.com/lupastance/ofiapps
repo_name: lupastance/ofiapps

markdown_extensions:
  - pymdownx.highlight:
      auto_title: false
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - abbr
  - attr_list
  - pymdownx.snippets
  - md_in_html
  - pymdownx.blocks.caption
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - def_list
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - css/extra.css